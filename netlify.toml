[build]
  command = "node scripts/build-flag.js"
  publish = "pwa"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Previews and branch deploys run on their own store and never upload a ride to intervals.icu (bridge/sandbox.js):
# a test ride on a preview stays on the preview. Only the production site uploads.
[context.copy.environment]
  THE_WAY_SANDBOX = "1"
[context.deploy-preview.environment]
  THE_WAY_SANDBOX = "1"
[context.branch-deploy.environment]
  THE_WAY_SANDBOX = "1"
